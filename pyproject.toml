[project]
name = "feli-flash"
version = "0.1.0"
description = "Tooling to build, preview, validate, and package shareable Anki (.apkg) decks from structured YAML/JSON specs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "genanki>=0.13.1",
    "markdown>=3.7",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
feli-flash = "feli_flash.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feli_flash"]

[tool.pytest.ini_options]
testpaths = ["tests"]
