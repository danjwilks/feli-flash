  # =========================================================================
  # 7. INTIMATE PARTNER VIOLENCE THROUGH COERCIVE CONTROL (IMG_4056.HEIC)
  # =========================================================================
  - id: ipv-coercive-control-definition
    type: qa
    context: "Torts · IPV Coercive Control"
    front: "How is **coercive control** defined in the tort of intimate partner violence?"
    back: "Conduct that has the effect of **subordinating** an intimate partner to the other partner's control."
    why_extra: "Captures patterns of domination and subordination within intimate relationships that isolated discrete torts miss."
    source_date: "IMG_4056.HEIC · 2026-11-25"
    add_reverse: false
    tags:
      - topic::torts::coercive_control
      - lens::definition
      - jurisdiction::canada
      - source::IMG_4056

  - id: ipv-relationship-aftermath
    type: qa
    context: "Torts · IPV Coercive Control · Element 1"
    front: "Why can post-separation abuse still satisfy element 1 of **IPV through coercive control**?"
    back: "Because element 1 covers abusive conduct arising in the intimate partner relationship or its **aftermath**."
    why_extra: "Per the card: separated parties ≠ intimate partner violence ended."
    source_date: "IMG_4056.HEIC · 2026-11-25"
    tags:
      - topic::torts::coercive_control
      - lens::boundary
      - jurisdiction::canada
      - source::IMG_4056

  - id: ipv-intent-requirement
    type: qa
    context: "Torts · IPV Coercive Control · Element 2"
    front: "What **intent** must D have for IPV through coercive control?"
    back: "Only intent to engage in the **impugned conduct**—D need not intend coercive control or harm."
    why_extra: "Matches the intent structure of classic intentional torts like battery and assault."
    source_date: "IMG_4056.HEIC · 2026-11-25"
    tags:
      - topic::torts::coercive_control
      - lens::element
      - jurisdiction::canada
      - source::IMG_4056

  - id: ipv-objective-standard
    type: qa
    context: "Torts · IPV Coercive Control · Element 3"
    front: "By what legal standard do courts assess whether abusive conduct constitutes **coercive control**?"
    back: "An **objective** standard: whether a reasonable person, fully aware of the relevant context, would perceive it as coercive control."
    why_extra: "Element 3 is met when contextualized perception of coercive control combines with abusive conduct."
    source_date: "IMG_4056.HEIC · 2026-11-25"
    tags:
      - topic::torts::coercive_control
      - lens::element
      - jurisdiction::canada
      - source::IMG_4056

  - id: ipv-vulnerability-knowledge
    type: qa
    context: "Torts · IPV Coercive Control · Element 3"
    front: "What specific **knowledge held by D** is factored into the objective contextual test for IPV coercive control?"
    back: "D's knowledge of **P's vulnerability**."
    why_extra: "An act that might seem minor in isolation can constitute coercive control when D knows and exploits P's particular vulnerability."
    source_date: "IMG_4056.HEIC · 2026-11-25"
    tags:
      - topic::torts::coercive_control
      - lens::boundary
      - jurisdiction::canada
      - source::IMG_4056

  - id: app-ipv-post-separation
    type: qa
    context: "Torts · IPV Coercive Control · Application"
    front: "After separating, D uses financial control and surveillance against ex-partner P, insisting the relationship is over—why does Element 1 still hold?"
    back: "Separation does not cut off liability because the tort covers abusive conduct in the relationship or its **aftermath**."
    why_extra: "Then check Element 2 (intent to do the impugned acts) and Element 3 (objective coercive control given D's knowledge of P's vulnerability)."
    source_date: "IMG_4056.HEIC · 2026-11-25"
    tags:
      - topic::torts::coercive_control
      - lens::application
      - jurisdiction::canada
      - source::IMG_4056

  - id: contrast-ipv-vs-iims-intent
    type: qa
    context: "Torts · IPV Coercive Control vs. IIMS"
    front: "How does D's required **intent toward harm or subordination** in IPV coercive control differ from IIMS?"
    back: "IPV requires only intent to do the **impugned conduct**, whereas IIMS requires subjective **intent or substantial certainty** of harm."
    why_extra: "On a domestic-abuse exam fact pattern, IPV coercive control avoids IIMS's high Element 2 mental-state barrier."
    source_date: "IMG_4055.HEIC & IMG_4056.HEIC · 2026-11-25"
    tags:
      - topic::torts::coercive_control
      - topic::torts::iims
      - lens::contrast
