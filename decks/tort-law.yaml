      - source::IMG_4056

  # =========================================================================
  # 8. BC STATUTORY PRIVACY TORT (IMG_4057.HEIC & IMG_4058.HEIC)
  # =========================================================================
  - id: bc-privacy-no-damage
    type: qa
    context: "Torts · BC Privacy · Harm"
    front: "What harm or damage must P prove under BC's **statutory privacy tort**?"
    back: "**None**—it is actionable **without proof of damage**."
    why_extra: "Like battery, BC's Privacy Act protects the privacy right per se without requiring financial or psychological injury."
    source_date: "IMG_4058.HEIC · 2026-11-25"
    tags:
      - topic::torts::bc_privacy
      - lens::boundary
      - jurisdiction::bc
      - source::IMG_4058

  - id: bc-privacy-test-sequence-cloze
    type: cloze
    context: "Torts · BC Privacy · 3-Step Test"
    text: "BC's 3-step statutory test asks: (1) Was P {{c1::entitled to privacy}}? (2) Did D violate it {{c2::wilfully}} without a claim of right? (3) Does any {{c3::s. 2 defence}} apply?"
    why_extra: "Follow all three steps in sequence on a BC exam: entitlement → wilful violation without claim of right → s. 2 statutory defences."
    source_date: "IMG_4057.HEIC · 2026-11-25"
    tags:
      - topic::torts::bc_privacy
      - lens::element
      - jurisdiction::bc
      - source::IMG_4057

  - id: bc-privacy-step1-entitlement
    type: qa
    context: "Torts · BC Privacy · Step 1"
    front: "Under step 1 of BC's statutory privacy test (**was P entitled to privacy?**), what two questions must be answered?"
    back: "Whether P held a **subjective** expectation of privacy, and whether it was **reasonable in all the circumstances**."
    why_extra: "Both the subjective prong and the objective reasonableness prong must be satisfied before moving to Step 2."
    source_date: "IMG_4057.HEIC · 2026-11-25"
    tags:
      - topic::torts::bc_privacy
      - lens::element
      - jurisdiction::bc
      - source::IMG_4057

  - id: bc-privacy-wilfully
    type: qa
    context: "Torts · BC Privacy · Step 2 (Fault)"
    front: "How is **'wilfully'** defined under BC's statutory privacy tort?"
    back: "D intended to violate privacy, or **knew / should have known** (at minimum, not accidental)."
    why_extra: "Truly accidental intrusions fail 'wilfully', whereas knowing or negligent-to-the-obvious violations can satisfy it."
    source_date: "IMG_4058.HEIC · 2026-11-25"
    tags:
      - topic::torts::bc_privacy
      - lens::definition
      - jurisdiction::bc
      - source::IMG_4058

  - id: bc-privacy-claim-of-right
    type: qa
    context: "Torts · BC Privacy · Step 2 (Claim of Right)"
    front: "What does **'without a claim of right'** mean under BC's statutory privacy tort?"
    back: "Lacking an **honest belief** in a state of facts that, **if it existed**, would be legal justification."
    why_extra: "This protects an honest mistake of fact that would legally justify the act—not merely wishing the law were different."
    source_date: "IMG_4058.HEIC · 2026-11-25"
    tags:
      - topic::torts::bc_privacy
      - lens::definition
      - jurisdiction::bc
      - source::IMG_4058

  - id: bc-privacy-nature-degree
    type: qa
    context: "Torts · BC Privacy · Nature & Degree (s. 1(2))"
    front: "Under BC's *Privacy Act*, what balances the **nature and degree** of privacy to which P is entitled?"
    back: "Reasonableness in the circumstances—giving due regard to others' **lawful interests**, plus both the type and **use** of the info."
    why_extra: "Context matters heavily: courts balance P's privacy expectation against lawful competing interests and how the information is used."
    source_date: "IMG_4057.HEIC & IMG_4058.HEIC · 2026-11-25"
    tags:
      - topic::torts::bc_privacy
      - lens::mechanism
      - jurisdiction::bc
      - source::IMG_4057
      - source::IMG_4058

  - id: bc-privacy-violation-factors
    type: qa
    context: "Torts · BC Privacy · Determining Violation (s. 1(3))"
    front: "When determining whether D's **act or conduct is a violation** under BC's *Privacy Act*, what contextual factors must courts consider?"
    back: "The **nature, incidence, and occasion** of the act, and any **domestic or other relationship** between the parties."
    why_extra: "Distinguish s. 1(2) (nature/degree of privacy entitled, balanced against lawful interests) from s. 1(3) (factors deciding whether the specific act violated it)."
    source_date: "IMG_4058.HEIC · 2026-11-25"
    tags:
      - topic::torts::bc_privacy
      - lens::element
      - jurisdiction::bc
      - source::IMG_4058

  - id: bc-privacy-eavesdropping
    type: qa
    context: "Torts · BC Privacy · Eavesdropping"
    front: "Why can off-property **eavesdropping** still violate BC's statutory privacy tort?"
    back: "Because privacy may be violated by eavesdropping **whether or not** it is done through a trespass."
    why_extra: "Statutory privacy covers modern listening devices and surveillance that never physically cross P's property line."
    source_date: "IMG_4058.HEIC · 2026-11-25"
    tags:
      - topic::torts::bc_privacy
      - lens::boundary
      - jurisdiction::bc
      - source::IMG_4058

  - id: bc-privacy-s2-private-defences
    type: qa
    context: "Torts · BC Privacy · s. 2(a)–(b) Defences"
    front: "What two **private-party defences** excuse a privacy violation under s. 2(a)–(b) of BC's *Privacy Act*?"
    back: "(a) **Consent**, and (b) an act incidental to exercising a lawful right of **defence of person or property**."
    why_extra: "For example, recording an intruder to protect one's home can fall under s. 2(b) if genuinely incidental to lawful defence of property."
    source_date: "IMG_4057.HEIC · 2026-11-25"
    tags:
      - topic::torts::bc_privacy
      - lens::defence
      - jurisdiction::bc
      - source::IMG_4057

  - id: bc-privacy-s2c-legal-auth
    type: qa
    context: "Torts · BC Privacy · s. 2(c) Defence"
    front: "What defence exists under **s. 2(c)** of BC's *Privacy Act*?"
    back: "The act is authorized under **law or a court**."
    why_extra: "Covers court-ordered surveillance, warrants, or statutory authorizations."
    source_date: "IMG_4057.HEIC · 2026-11-25"
    tags:
      - topic::torts::bc_privacy
      - lens::defence
      - jurisdiction::bc
      - source::IMG_4057

  - id: bc-privacy-s2d-officers
    type: qa
    context: "Torts · BC Privacy · s. 2(d) Defences"
    front: "Which two **officer** categories have a defence under s. 2(d) of BC's *Privacy Act*?"
    back: "(i) A **peace officer** in the course of duty, and (ii) a **public officer** engaged in an investigation under law in the course of duty."
    why_extra: "Both s. 2(d)(i) and s. 2(d)(ii) require the officer to be acting within the lawful course of their duty."
    source_date: "IMG_4057.HEIC · 2026-11-25"
    tags:
      - topic::torts::bc_privacy
      - lens::defence
      - jurisdiction::bc
      - source::IMG_4057

  - id: app-bc-privacy-claim-of-right
    type: qa
    context: "Torts · BC Privacy · Application"
    front: "D deliberately accesses P's private medical file, honestly (but mistakenly) believing P signed a valid consent form—which **BC *Privacy Act*** prong does this defeat?"
    back: "**Without a claim of right**—an honest belief in a state of facts that, if it existed, would legally justify the act defeats liability."
    why_extra: "If P had actually consented, s. 2(a) would legally justify the access; an honest mistake of fact about consent establishes a claim of right even if D ought to have double-checked ('wilfully')."
    source_date: "IMG_4058.HEIC · 2026-11-25"
    tags:
      - topic::torts::bc_privacy
      - lens::application
      - jurisdiction::bc
      - source::IMG_4058

  # =========================================================================
  # 9. PUBLIC DISCLOSURE OF PRIVATE FACTS (IMG_4061.HEIC)
  # =========================================================================
  - id: public-disclosure-elements-cloze
    type: cloze
    context: "Torts · Public Disclosure of Private Facts"
    text: "Public disclosure requires D to publicize an aspect of P's private life {{c1::without consent}} where the matter or {{c2::its publication}} is highly offensive and lacks {{c3::legitimate public concern}}."
    why_extra: "Note the disjunctive prong in Element 3: either the matter publicized OR its publication being highly offensive to a reasonable person in P's position suffices."
    source_date: "IMG_4061.HEIC · 2026-11-25"
    tags:
      - topic::torts::public_disclosure
      - lens::element
      - jurisdiction::canada
      - source::IMG_4061

  - id: public-disclosure-standards
    type: qa
    context: "Torts · Public Disclosure · Standards"
    front: "In public disclosure of private facts, how does the standard for **'private'** differ from **'highly offensive'**?"
    back: "'Private' uses an objective **reasonable person** test; 'highly offensive' views a reasonable person **in P's position** (seems more subjective/contextualized)."
    why_extra: "The handwritten note flags '(seems more subjective standard?)' because placing the reasonable person specifically 'in P's position' contextualizes the test."
    source_date: "IMG_4061.HEIC · 2026-11-25"
    tags:
      - topic::torts::public_disclosure
      - lens::boundary
      - jurisdiction::canada
      - source::IMG_4061

  - id: public-disclosure-harm
    type: qa
    context: "Torts · Public Disclosure · Harm"
    front: "What **damages or harm** must P prove in public disclosure of private facts?"
    back: "**None**—no proof of damages or harm is required."
    why_extra: "Like battery and BC's statutory privacy tort, P succeeds once the four disclosure elements are established."
    source_date: "IMG_4061.HEIC · 2026-11-25"
    tags:
      - topic::torts::public_disclosure
      - lens::boundary
      - jurisdiction::canada
      - source::IMG_4061

  - id: app-public-disclosure-public-concern
    type: qa
    context: "Torts · Public Disclosure · Application"
    front: "A journalist publishes a cabinet minister's secret conflict-of-interest financial records without consent—why does **public disclosure of private facts** fail?"
    back: "The disclosure is a matter of **legitimate public concern**, which defeats element 4 even without consent."
    why_extra: "Contrast with leaking a private citizen's intimate photos: no legitimate public concern, highly offensive, and actionable without proof of harm."
    source_date: "IMG_4061.HEIC · 2026-11-25"
    tags:
      - topic::torts::public_disclosure
      - lens::application
      - jurisdiction::canada
      - source::IMG_4061

  - id: contrast-public-disclosure-vs-intrusion-act
    type: qa
    context: "Torts · Public Disclosure vs. ONT Intrusion · Act"
    front: "How does the **core wrongful act** in public disclosure of private facts differ from Ontario's intrusion upon seclusion?"
    back: "Public disclosure targets non-consensual **publication** of private facts; intrusion upon seclusion targets the unauthorized **invasion** itself."
    why_extra: "Snooping through a medical file without sharing it is intrusion upon seclusion; posting private details online is public disclosure."
    source_date: "IMG_4061.HEIC & IMG_4062.HEIC · 2026-11-25"
    tags:
      - topic::torts::public_disclosure
      - topic::torts::intrusion_upon_seclusion
      - lens::contrast
      - jurisdiction::canada
      - jurisdiction::ontario
      - source::IMG_4061
      - source::IMG_4062

  - id: contrast-public-disclosure-vs-intrusion-standard
    type: qa
    context: "Torts · Public Disclosure vs. ONT Intrusion · Standard"
    front: "How does the **'highly offensive'** standard differ between public disclosure of private facts and Ontario's intrusion upon seclusion?"
    back: "Public disclosure views a reasonable person **in P's position**, whereas Ontario's intrusion uses a pure **objective** test."
    why_extra: "Placing the reasonable person 'in P's position' makes public disclosure's offensiveness test more contextualized than Ontario's pure objective intrusion test."
    source_date: "IMG_4061.HEIC & IMG_4062.HEIC · 2026-11-25"
    tags:
      - topic::torts::public_disclosure
      - topic::torts::intrusion_upon_seclusion
      - lens::contrast
      - jurisdiction::canada
      - jurisdiction::ontario
      - source::IMG_4061
      - source::IMG_4062

  - id: contrast-public-disclosure-vs-intrusion-limit
    type: qa
    context: "Torts · Public Disclosure vs. ONT Intrusion · Limit"
    front: "How does the **justification or public-interest limit** differ between public disclosure of private facts and Ontario's intrusion upon seclusion?"
    back: "Public disclosure is barred by **legitimate public concern**; Ontario's intrusion is barred by **lawful justification**."
    why_extra: "Keep both privacy limits sharp on exams: publication + public-concern limit vs. invasion + lawful-justification limit."
    source_date: "IMG_4061.HEIC & IMG_4062.HEIC · 2026-11-25"
    tags:
      - topic::torts::public_disclosure
      - topic::torts::intrusion_upon_seclusion
      - lens::contrast
      - jurisdiction::canada
      - jurisdiction::ontario
      - source::IMG_4061
      - source::IMG_4062

  # =========================================================================
  # 10. ONTARIO: INTRUSION UPON SECLUSION (IMG_4062.HEIC)
  # =========================================================================
  - id: intrusion-elements-cloze
    type: cloze
    context: "Torts · Intrusion upon Seclusion (ONT)"
    text: "Ontario's intrusion upon seclusion requires {{c1::intentional or reckless}} invasion of P's private affairs or concerns {{c2::without lawful justification}}, objectively regarded as {{c3::highly offensive}} (causing distress, humiliation, or anguish)."
    why_extra: "Recklessness is explicitly included under Element 1—D need not act with deliberate malice."
    source_date: "IMG_4062.HEIC · 2026-11-25"
    tags:
      - topic::torts::intrusion_upon_seclusion
      - lens::element
      - jurisdiction::ontario
      - source::IMG_4062

  - id: intrusion-objective-standards
    type: qa
    context: "Torts · Intrusion upon Seclusion (ONT) · Standards"
    front: "In Ontario's intrusion upon seclusion, what standard governs **privacy expectations** and **'highly offensive'**?"
    back: "Both are assessed **objectively**—requiring an objective privacy expectation and a significant invasion."
    why_extra: "Minor or trivial intrusions fail the objective 'highly offensive / significant invasion' threshold."
    source_date: "IMG_4062.HEIC · 2026-11-25"
    tags:
      - topic::torts::intrusion_upon_seclusion
      - lens::boundary
      - jurisdiction::ontario
      - source::IMG_4062

  - id: intrusion-distress-presumption
    type: qa
    context: "Torts · Intrusion upon Seclusion (ONT) · Harm"
    front: "In Ontario's intrusion upon seclusion, how is **distress, humiliation, or anguish** established once the other elements are proven?"
    back: "It is **generally presumed** once the other elements are proven."
    why_extra: "P does not fail merely for lacking proof of economic loss or independent psychiatric evidence."
    source_date: "IMG_4062.HEIC · 2026-11-25"
    tags:
      - topic::torts::intrusion_upon_seclusion
      - lens::mechanism
      - jurisdiction::ontario
      - source::IMG_4062

  - id: contrast-bc-vs-ont-privacy-fault
    type: qa
    context: "Torts · BC Privacy vs. ONT Intrusion · Fault"
    front: "How does the required **fault** in Ontario's intrusion upon seclusion compare to BC's statutory privacy tort?"
    back: "Ontario requires **intentional or reckless** conduct; BC requires a **wilful** violation (intended or knew/should have known) without claim of right."
    why_extra: "Notice BC's 'wilfully' still reaches 'knew or should have known (at minimum not accidental)', paired with absence of a claim of right."
    source_date: "IMG_4058.HEIC & IMG_4062.HEIC · 2026-11-25"
    tags:
      - topic::torts::bc_privacy
      - topic::torts::intrusion_upon_seclusion
      - lens::contrast
      - jurisdiction::bc
      - jurisdiction::ontario
      - source::IMG_4058
      - source::IMG_4062

  - id: contrast-bc-vs-ont-privacy-threshold
    type: qa
    context: "Torts · BC Privacy vs. ONT Intrusion · Threshold"
    front: "How does the **severity threshold** in Ontario's intrusion upon seclusion differ from BC's statutory privacy tort?"
    back: "Ontario requires a **highly offensive** (significant) invasion; BC weighs reasonable privacy expectations against others' **lawful interests**."
    why_extra: "BC uses its statutory Privacy Act rather than Ontario's common-law intrusion upon seclusion tort."
    source_date: "IMG_4058.HEIC & IMG_4062.HEIC · 2026-11-25"
    tags:
      - topic::torts::bc_privacy
      - topic::torts::intrusion_upon_seclusion
      - lens::contrast
      - jurisdiction::bc
      - jurisdiction::ontario
      - source::IMG_4058
      - source::IMG_4062

  # =========================================================================
  # 11. CONVERSION (IMG_4059.HEIC)
  # =========================================================================
  - id: conversion-elements-cloze
    type: cloze
    context: "Torts · Conversion"
    text: "Conversion requires {{c1::a positive act}} (without lawful justification; intent not required) involving another's {{c2::chattel}} so as to deny or negate {{c3::title}}."
    why_extra: "Element 3 examples of interference: handling, transferring, disposing of, destroying, or damaging the goods of another."
    source_date: "IMG_4059.HEIC · 2026-11-25"
    tags:
      - topic::torts::conversion
      - lens::element
      - jurisdiction::canada
      - source::IMG_4059

  - id: conversion-wrongful-act-justification
    type: qa
    context: "Torts · Conversion · Element 1"
    front: "What makes D's handling of chattel a **'wrongful act'** under element 1 of conversion?"
    back: "A **positive act** done **without lawful justification** (wrongful intent is not required)."
    why_extra: "Pure omission does not establish conversion; D must commit a positive unauthorized act interfering with another's goods."
    source_date: "IMG_4059.HEIC · 2026-11-25"
    tags:
      - topic::torts::conversion
      - lens::element
      - jurisdiction::canada
      - source::IMG_4059

  - id: conversion-dominion
    type: qa
    context: "Torts · Conversion · Element 4"
    front: "What does **'exercising dominion'** mean in the tort of conversion?"
    back: "Seriously interfering with the owner's **right of possession** in a way that denies or negates their title to the chattel."
    why_extra: "Conversion treats D as having effectively forced a sale of the goods by acting as if D owned them."
    source_date: "IMG_4059.HEIC · 2026-11-25"
    tags:
      - topic::torts::conversion
      - lens::definition
      - jurisdiction::canada
      - source::IMG_4059

  - id: conversion-mere-use-boundary
    type: qa
    context: "Torts · Conversion · Boundary"
    front: "Why does merely moving or changing the location of someone's chattel usually fail **conversion**?"
    back: "Unless serious enough to show intent to **exercise dominion**, mere moving or use does not negate title."
    why_extra: "Minor temporary interference without denying title does not rise to conversion."
    source_date: "IMG_4059.HEIC · 2026-11-25"
    tags:
      - topic::torts::conversion
      - lens::boundary
      - jurisdiction::canada
      - source::IMG_4059

  - id: app-conversion-good-faith-buyer
    type: qa
    context: "Torts · Conversion · Application"
    front: "D innocently buys a stolen bicycle in good faith and resells it—why is D still liable for **conversion**?"
    back: "Conversion requires only a **positive act** without lawful justification that negates title—**wrongful intent** or knowledge of theft is not required."
    why_extra: "Reselling exercises dominion over the true owner's chattel, even when D acted in complete good faith."
    source_date: "IMG_4059.HEIC · 2026-11-25"
    tags:
      - topic::torts::conversion
      - lens::application
      - jurisdiction::canada
      - source::IMG_4059

  - id: contrast-conversion-vs-trespass-intent
    type: qa
    context: "Torts · Conversion vs. Trespass to Land"
    front: "How does the required **fault** in conversion compare to trespass to land?"
    back: "Conversion requires a **positive wrongful act** (intent not required); trespass to land requires **intentional** conduct focused on physical consequences."
    why_extra: "In conversion, Element 4 can be met by either the intention to OR the practical effect of denying/negating title."
    source_date: "IMG_4059.HEIC & IMG_4060.HEIC · 2026-11-25"
    tags:
      - topic::torts::conversion
      - topic::torts::trespass_to_land
      - lens::contrast
      - jurisdiction::canada
      - source::IMG_4059
      - source::IMG_4060

  # =========================================================================
  # 12. TRESPASS TO LAND (IMG_4060.HEIC)
  # =========================================================================
  - id: trespass-land-definition
    type: qa
    context: "Torts · Property Torts"
    front: "What is the legal definition of **trespass to land**?"
    back: "An intentional, direct physical **interference with land** in another's possession without lawful justification."
    why_extra: "Protects **possession** of land (e.g., a tenant in possession can sue), not merely registered title."
    source_date: "IMG_4060.HEIC · 2026-11-25"
    add_reverse: true
    tags:
      - topic::torts::trespass_to_land
      - lens::definition
      - jurisdiction::canada
      - source::IMG_4060

  - id: trespass-land-elements-cloze
    type: cloze
    context: "Torts · Trespass to Land"
    text: "Trespass to land requires (1) {{c1::intentional}} conduct causing (2) {{c2::direct}} and (3) {{c3::physical}} interference with another's land."
    why_extra: "Intent focuses on the conduct's physical consequences—D need not know the land belongs to P."
    source_date: "IMG_4060.HEIC · 2026-11-25"
    tags:
      - topic::torts::trespass_to_land
      - lens::element
      - jurisdiction::canada
      - source::IMG_4060

  - id: trespass-land-physical-interference
    type: qa
    context: "Torts · Trespass to Land · Element 3"
    front: "What counts as **physical interference** under element 3 of trespass to land?"
    back: "**Physical presence** of D or an **object** placed or left by D on P's land."
    why_extra: "Physical intrusion by either D personally or an object D places/leaves satisfies Element 3."
    source_date: "IMG_4060.HEIC · 2026-11-25"
    tags:
      - topic::torts::trespass_to_land
      - lens::element
      - jurisdiction::canada
      - source::IMG_4060

  - id: trespass-land-hickey-minimal
    type: qa
    context: "Torts · Trespass to Land · Threshold"
    front: "How slight can physical interference be in trespass to land, and what **case** illustrates this?"
    back: "Interference can be **minimal** (*Hickey*)."
    why_extra: "Even a tiny physical intrusion by D or an object satisfies trespass to land."
    source_date: "IMG_4060.HEIC · 2026-11-25"
    tags:
      - topic::torts::trespass_to_land
      - lens::boundary
      - jurisdiction::canada
      - source::IMG_4060

  - id: trespass-direct-vs-consequential
    type: qa
    context: "Torts · Trespass to Land · Directness"
    front: "What distinguishes **direct** interference (trespass to land) from **consequential** interference (e.g., gradual seepage)?"
    back: "Direct interference is an **immediate** consequence of force set in motion by D, not an indirect or gradual result."
    why_extra: "Indirect or gradual harms typically belong under nuisance or negligence rather than trespass to land."
    source_date: "IMG_4060.HEIC · 2026-11-25"
    tags:
      - topic::torts::trespass_to_land
      - lens::boundary
      - jurisdiction::canada
      - source::IMG_4060

  - id: trespass-continuing-vs-consequence
    type: qa
    context: "Torts · Trespass to Land · Continuing Trespass"
    front: "How does a **continuing trespass** differ from a mere **consequence of trespass**?"
    back: "Leaving an **object** on P's land continues until removed; a lasting mark of past entry (e.g., a **hole**) is only a consequence."
    why_extra: "A continuing trespass renews the cause of action each day the object stays unremoved, which matters for limitation periods."
    source_date: "IMG_4060.HEIC · 2026-11-25"
    tags:
      - topic::torts::trespass_to_land
      - lens::contrast
      - jurisdiction::canada
      - source::IMG_4060

  - id: app-trespass-trench-vs-bulldozer
    type: qa
    context: "Torts · Trespass to Land · Application"
    front: "D trespasses, digs a trench on P's land, and leaves—why is the unfilled trench **not** a continuing trespass (unlike leaving a bulldozer behind)?"
    back: "The trench is a lasting **consequence of past trespass**, whereas leaving an **object** on P's land continues daily until removed."
    why_extra: "Key exam issue: limitation clocks keep resetting for an unremoved object, but run from the original entry for a dug hole."
    source_date: "IMG_4060.HEIC · 2026-11-25"
    tags:
      - topic::torts::trespass_to_land
      - lens::application
      - jurisdiction::canada
      - source::IMG_4060

  # =========================================================================
  # 13. FRAUD / CIVIL DECEIT (IMG_4063.HEIC)
  # =========================================================================
  - id: fraud-representation-element
    type: qa
    context: "Torts · Fraud · Element 1"
    front: "Under element 1 of civil **fraud**, what kind of statement must P prove and how is its falsity assessed?"
    back: "A **false factual representation**, with falsity assessed **objectively** (onus on P)."
    why_extra: "Pure opinion or puffery is not a factual representation; P bears the initial burden of proving objective falsity."
    source_date: "IMG_4063.HEIC · 2026-11-25"
    tags:
      - topic::torts::fraud
      - lens::element
      - jurisdiction::canada
      - source::IMG_4063

  - id: fraud-fault-element
    type: qa
    context: "Torts · Fraud · Element 2 (Fault)"
    front: "What two **fault states** satisfy element 2 of civil fraud?"
    back: "D **knew** the statement was false, or was **reckless** as to its truth."
    why_extra: "Mere carelessness does not satisfy Element 2—D must either know the statement is false or act recklessly as to its truth."
    source_date: "IMG_4063.HEIC · 2026-11-25"
    tags:
      - topic::torts::fraud
      - lens::element
      - jurisdiction::canada
      - source::IMG_4063

  - id: fraud-honest-belief-test
    type: qa
    context: "Torts · Fraud · Element 2 (Standard)"
    front: "By what **subjective test** do courts assess D's knowledge or recklessness under element 2 of civil fraud?"
    back: "Whether D subjectively held an **honest belief** in the statement's truth."
    why_extra: "Both knowledge of falsity and recklessness turn subjectively on the representor's lack of honest belief."
    source_date: "IMG_4063.HEIC · 2026-11-25"
    tags:
      - topic::torts::fraud
      - lens::mechanism
      - jurisdiction::canada
      - source::IMG_4063

  - id: fraud-recklessness-vs-negligence
    type: qa
    context: "Torts · Fraud · Recklessness vs. Negligence"
    front: "In civil fraud, how does actionable **recklessness** differ from non-actionable **negligence**?"
    back: "Negligence is not enough; recklessness requires **dishonest indifference** to accuracy or **pretending to know** when D does not."
    why_extra: "If D genuinely held an honest (even careless) belief in the statement's truth, civil fraud fails—pivot to negligent misrepresentation."
    source_date: "IMG_4063.HEIC · 2026-11-25"
    tags:
      - topic::torts::fraud
      - lens::contrast
      - jurisdiction::canada
      - source::IMG_4063

  - id: fraud-intent-to-induce
    type: qa
    context: "Torts · Fraud · Element 3"
    front: "How is element 3 of civil **fraud** (D intended P to act on the false representation) usually proven?"
    back: "Usually inferred from the **surrounding circumstances**, rather than direct proof of D's state of mind."
    why_extra: "Defendants rarely admit intending to deceive, so courts infer intent to induce from the transactional context."
    source_date: "IMG_4063.HEIC · 2026-11-25"
    tags:
      - topic::torts::fraud
      - lens::mechanism
      - jurisdiction::canada
      - source::IMG_4063

  - id: fraud-reliance-causation
    type: qa
    context: "Torts · Fraud · Elements 4–5"
    front: "What must P prove to satisfy **material reliance** and loss in civil fraud?"
    back: "D's statement induced P to **alter their position** (need not be the only cause), and that reliance resulted in **loss**."
    why_extra: "Even when P had additional reasons to enter a deal, fraud succeeds if D's false statement materially induced the alteration of position and caused loss."
    source_date: "IMG_4063.HEIC · 2026-11-25"
    tags:
      - topic::torts::fraud
      - lens::element
      - jurisdiction::canada
      - source::IMG_4063

  - id: fraud-bc-reliance-test
    type: qa
    context: "Torts · Fraud · BC Standard Contrast"
    front: "In **BC** civil fraud, how does the standard for **material inducement** (element 4) differ from D's fault (element 2)?"
    back: "Element 4 uses an **objective** test in BC, whereas element 2 tests D's **subjective** honest belief."
    why_extra: "Contrast Element 2 (subjective honest belief held by D) with Element 4 in BC (objective inducement/reliance test)."
    source_date: "IMG_4063.HEIC · 2026-11-25"
    tags:
      - topic::torts::fraud
      - lens::contrast
      - jurisdiction::bc
      - source::IMG_4063

  - id: app-fraud-honest-careless-seller
    type: qa
    context: "Torts · Fraud · Application"
    front: "Seller D carelessly misstates a roof's age while genuinely believing it is true—why does civil **fraud** fail?"
    back: "D held a subjectively **honest belief**, defeating both knowledge of falsity and **dishonest indifference** (negligence alone is insufficient)."
    why_extra: "Exam pivot: when an inaccurate statement is careless rather than dishonest, analyze negligent misrepresentation instead of civil fraud."
    source_date: "IMG_4063.HEIC · 2026-11-25"
    tags:
      - topic::torts::fraud
      - lens::application
      - jurisdiction::canada
      - source::IMG_4063

  # =========================================================================
  # 14. UNLAWFUL MEANS TORT (IMG_4064.HEIC)
  # =========================================================================
  - id: unlawful-means-elements-cloze
    type: cloze
    context: "Torts · Unlawful Means Tort"
    text: "The unlawful means tort requires D to commit an actionable civil wrong against a {{c1::third party}} with {{c2::specific intent}} (when acting) to cause {{c3::economic harm}} to P."
    why_extra: "Three-party structure: D strikes at P indirectly by committing an actionable civil wrong against a third party, causing economic harm to P."
    source_date: "IMG_4064.HEIC · 2026-11-25"
    tags:
      - topic::torts::unlawful_means
      - lens::element
      - jurisdiction::canada
      - source::IMG_4064

  - id: unlawful-means-definition-unlawful
    type: qa
    context: "Torts · Unlawful Means · Element 1"
    front: "What narrows the definition of an **'unlawful act'** in the unlawful means tort?"
    back: "Conduct giving rise to a **civil action** by the third party (or that would if the third party suffered loss)."
    why_extra: "Regulatory breaches or crimes that do not support a private civil claim by the third party do not qualify."
    source_date: "IMG_4064.HEIC · 2026-11-25"
    tags:
      - topic::torts::unlawful_means
      - lens::boundary
      - jurisdiction::canada
      - source::IMG_4064

  - id: unlawful-means-specific-intent
    type: qa
    context: "Torts · Unlawful Means · Element 3 (Included)"
    front: "What **specific intent** satisfies element 3 of the unlawful means tort?"
    back: "Intending economic harm to P as an **end in itself** or a **necessary means** to achieve an end serving an ulterior motive."
    why_extra: "D must hold this intent when committing the unlawful act against the third party."
    source_date: "IMG_4064.HEIC · 2026-11-25"
    tags:
      - topic::torts::unlawful_means
      - lens::element
      - jurisdiction::canada
      - source::IMG_4064

  - id: unlawful-means-excluded-states
    type: qa
    context: "Torts · Unlawful Means · Element 3 (Excluded)"
    front: "What three mental states are explicitly **excluded** from element 3 of the unlawful means tort?"
    back: "**Inevitable consequences** without specific intent, **knowledge it will probably cause harm**, and recklessness as to harm."
    why_extra: "Foreseen collateral economic damage to P is not enough—D must specifically target P's economic harm as an end or necessary means."
    source_date: "IMG_4064.HEIC · 2026-11-25"
    tags:
      - topic::torts::unlawful_means
      - lens::boundary
      - jurisdiction::canada
      - source::IMG_4064

  - id: app-unlawful-means-regulatory-breach
    type: qa
    context: "Torts · Unlawful Means · Application"
    front: "D intentionally breaches a **licensing regulation** when dealing with a supplier to bankrupt competitor P—why does the unlawful means tort fail?"
    back: "An unlawful act must support a **civil action** by the third party; mere regulatory or criminal breaches do not qualify."
    why_extra: "Even when D specifically intends to ruin P, Element 1 fails unless the third party has an actionable civil claim (or would if it suffered loss)."
    source_date: "IMG_4064.HEIC · 2026-11-25"
    tags:
      - topic::torts::unlawful_means
      - lens::application
      - jurisdiction::canada
      - source::IMG_4064

  - id: contrast-unlawful-means-vs-iims-intent
    type: qa
    context: "Torts · Unlawful Means vs. IIMS"
    front: "If D knows harm to P is an **inevitable side-effect** (not D's goal or necessary means), why does this satisfy IIMS yet fail the unlawful means tort?"
    back: "IIMS imputes intent from **substantial certainty**; unlawful means excludes inevitable collateral harm without **specific intent** targeting P."
    why_extra: "Unlawful means has the strictest intent gate in this deck—even higher than IIMS Element 2."
    source_date: "IMG_4055.HEIC & IMG_4064.HEIC · 2026-11-25"
    tags:
      - topic::torts::unlawful_means
      - topic::torts::iims
      - lens::contrast
      - jurisdiction::canada
      - source::IMG_4055
      - source::IMG_4064

  - id: contrast-unlawful-means-vs-inducing-breach
    type: qa
    context: "Torts · Unlawful Means vs. Inducing Breach"
    front: "How does the **unlawful means tort** differ from **inducing breach of contract** in what D does to the third party?"
    back: "Unlawful means requires an independently **actionable civil wrong** against the third party; inducing breach requires procuring a **breach of contract** with P."
    why_extra: "Inducing breach is accessory liability for a contract breach; unlawful means is primary liability for targeting P via a civil wrong against a third party."
    source_date: "IMG_4064.HEIC & IMG_4065.HEIC · 2026-11-25"
    tags:
      - topic::torts::unlawful_means
      - topic::torts::inducing_breach
      - lens::contrast
      - jurisdiction::canada
      - source::IMG_4064
      - source::IMG_4065

  # =========================================================================
  # 15. INDUCING BREACH OF CONTRACT (IMG_4065.HEIC)
  # =========================================================================
  - id: inducing-breach-prerequisites
    type: qa
    context: "Torts · Inducing Breach of Contract · Prerequisites"
    front: "Aside from D's mental state and defences, what four **objective elements** (elements 1–3, 7) must P prove for inducing breach of contract?"
    back: "A **valid contract** between P and a 3rd party, a **breach** caused by D's acts, and resulting damage to P."
    why_extra: "Covers Elements 1, 2, 3, and 7: without a valid existing contract, an actual breach caused by D, and damage, the claim fails."
    source_date: "IMG_4065.HEIC · 2026-11-25"
    tags:
      - topic::torts::inducing_breach
      - lens::element
      - jurisdiction::canada
      - source::IMG_4065

  - id: inducing-breach-knowledge
    type: qa
    context: "Torts · Inducing Breach of Contract · Knowledge"
    front: "What two **knowledge** elements (elements 4–5) must P prove against D for inducing breach of contract?"
    back: "D was **aware of the contract** and **knew** D was inducing a breach of it."
    why_extra: "Accidentally disrupting a contract D did not know existed—or did not know would be breached—fails liability."
    source_date: "IMG_4065.HEIC · 2026-11-25"
    tags:
      - topic::torts::inducing_breach
      - lens::element
      - jurisdiction::canada
      - source::IMG_4065

  - id: inducing-breach-intent
    type: qa
    context: "Torts · Inducing Breach of Contract · Intent"
    front: "What **intent** (element 6) must D have for inducing breach of contract?"
    back: "Intent to **procure the breach**—as a desired end or a means to an end."
    why_extra: "Like unlawful means, foreseeing that a breach might incidentally happen without intending to procure it is insufficient."
    source_date: "IMG_4065.HEIC · 2026-11-25"
    tags:
      - topic::torts::inducing_breach
      - lens::element
      - jurisdiction::canada
      - source::IMG_4065

  - id: inducing-breach-justification-defence
    type: qa
    context: "Torts · Inducing Breach of Contract · Defence"
    front: "What two **examples** support D's defence of justification in inducing breach of contract?"
    back: "Giving **professional advice**, or acting in good faith to protect D's own **legitimate economic rights** (e.g., rights equal or superior to P's)."
    why_extra: "Justification is a defence raised by D (Element 8); the handwritten note marks 'maybe rights equal to or superior than those of P' as an illustrative example."
    source_date: "IMG_4065.HEIC · 2026-11-25"
    tags:
      - topic::torts::inducing_breach
      - lens::defence
      - jurisdiction::canada
      - source::IMG_4065

  - id: contrast-damage-requirement-economic-vs-perse
    type: qa
    context: "Torts · Proof of Damage Contrast"
    front: "How does the **proof of damage** requirement in inducing breach of contract and fraud differ from battery and BC's privacy tort?"
    back: "Inducing breach and fraud require proof of **actual damage or loss**, whereas battery and BC's privacy tort are actionable **without proof of harm**."
    why_extra: "Quick exam check: no-damage-required torts in this deck include Battery, BC Statutory Privacy, and Public Disclosure of Private Facts (plus presumed distress in ONT Intrusion)."
    source_date: "IMG_4051, 4058, 4063, 4065 · 2026-11-25"
