      - source::IMG_4055

  - id: contrast-harassment-vs-iims-fault
    type: qa
    context: "Torts · Common-Law Harassment vs. IIMS · Fault"
    front: "How does D's required **mental state** in common-law harassment differ from IIMS?"
    back: "Harassment asks if D **knew or ought to have known** acts were unwelcome; IIMS requires subjective **intent or substantial certainty** of harm."
    why_extra: "When D repeatedly stalks P while denying intent to cause injury, common-law harassment succeeds via 'ought to have known' even if IIMS Element 2 fails."
    source_date: "IMG_4054.HEIC & IMG_4055.HEIC · 2026-11-25"
    tags:
      - topic::torts::harassment
      - topic::torts::iims
