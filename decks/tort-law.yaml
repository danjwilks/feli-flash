# Evidence-Based Anki Deck: Canadian Tort Law (Post-Review v2)
# Converted from 16 handwritten study cards (IMG_4050.HEIC - IMG_4065.HEIC)
# Architecture:
#   - Flat broad deck with rich hierarchical '::' tags (natural cross-topic interleaving)
#   - Atomic Q&A + Optional Reverse (non-leaking Context) + tight rewritten Cloze (<= 3 words/blank)
#   - Full 5-lens coverage: definition, element, boundary, mechanism, contrast, defence, application
#   - Strict signaling hygiene (<= 2 bold spans per field), zero binary prompts, zero "List all N" dumps

deck:
  name: "Canadian Tort Law"
  description: >-
    Evidence-based Canadian Tort Law deck converted from handwritten study cards.
    Recommended Anki 25.07+ settings: FSRS-6 ON, Desired Retention 0.85-0.90,
    learning/relearning steps 10m-15m, all 3 sibling-burying options ON,
    10 new cards/day (set New card gather/sort order to Random for cross-topic interleaving),
    uncapped reviews, leech suspend at 6-8 lapses.
  tags:
    - canadian_law

cards:
  # =========================================================================
  # 1. BATTERY (IMG_4051.HEIC)
  # =========================================================================
  - id: battery-definition
    type: qa
    context: "Torts · Intentional Torts (Person)"
    front: "What is the legal definition of **battery**?"
    back: "The actual infliction of **unlawful force** on another person."
    why_extra: "Unlike assault (apprehension of imminent contact) or false imprisonment (total restraint), battery requires actual physical contact with P's body."
    source_date: "IMG_4051.HEIC · 2026-11-25"
    add_reverse: true
    tags:
      - topic::torts::battery
      - lens::definition
      - jurisdiction::canada
      - source::IMG_4051

  - id: battery-elements-cloze
    type: cloze
    context: "Torts · Battery"
    text: "Battery requires D to intentionally inflict {{c1::harmful or offensive}} contact with P's body beyond {{c2::ordinary social intercourse}} (assessed objectively)."
    why_extra: "The card notes 'beyond ordinary / generally acceptable social intercourse'—incidental brushing in a crowd is not battery."
    source_date: "IMG_4051.HEIC · 2026-11-25"
    tags:
      - topic::torts::battery
      - lens::element
      - jurisdiction::canada
      - source::IMG_4051

  - id: battery-per-se-harm
    type: qa
    context: "Torts · Battery · Harm"
    front: "What physical injury or harm must P prove to succeed in **battery**?"
    back: "**None**—battery is a **per se** tort actionable without proof of harm."
    why_extra: "Bodily autonomy is protected per se, so offensive non-injurious contact (e.g., spitting or unwanted touching) is still actionable."
    source_date: "IMG_4051.HEIC · 2026-11-25"
    tags:
      - topic::torts::battery
      - lens::boundary
      - jurisdiction::canada
      - source::IMG_4051

  - id: battery-burden-shift
    type: qa
    context: "Torts · Battery · Burden of Proof"
    front: "In battery, what happens to the **burden of proof** once P establishes physical contact?"
    back: "The burden shifts to **D** to prove or raise a defence."
    why_extra: "Once P proves direct contact, D bears the onus of establishing a lawful justification such as consent or self-defence."
    source_date: "IMG_4051.HEIC · 2026-11-25"
    tags:
      - topic::torts::battery
      - lens::mechanism
      - jurisdiction::canada
      - source::IMG_4051

  - id: contrast-battery-vs-assault-intent
    type: qa
    context: "Torts · Battery vs. Assault"
    front: "How does the required **intent** in battery differ from the required intent in assault?"
    back: "Battery requires intent to inflict **contact**; assault requires intent to create **apprehension** of imminent battery (not intent to commit the battery)."
    why_extra: "Feinting a punch right in front of P to scare them—without intending to land the blow—satisfies assault's intent element even though D never intended battery."
    source_date: "IMG_4051.HEIC & IMG_4053.HEIC · 2026-11-25"
    tags:
      - topic::torts::battery
      - topic::torts::assault
      - lens::contrast
      - jurisdiction::canada
      - source::IMG_4051
      - source::IMG_4053

  # =========================================================================
  # 2. ASSAULT (IMG_4053.HEIC)
  # =========================================================================
  - id: assault-definition
    type: qa
    context: "Torts · Intentional Torts (Person)"
    front: "What is the legal definition of **assault**?"
    back: "An act or intentional creation of apprehension of **imminent** harmful or offensive (unlawful) physical contact."
    why_extra: "Assault protects against fear of knowledge and expectation of immediate unlawful contact—no actual touching is required."
    source_date: "IMG_4053.HEIC · 2026-11-25"
    add_reverse: true
    tags:
      - topic::torts::assault
      - lens::definition
      - jurisdiction::canada
      - source::IMG_4053

  - id: assault-apprehension-standard
    type: qa
    context: "Torts · Assault · Apprehension"
    front: "By what standard do courts assess P's **apprehension or fear** of imminent unlawful contact in assault?"
    back: "It is determined **objectively** (reasonable apprehension or fear of imminent physical contact)."
    why_extra: "P must face a reasonable expectation of immediate battery, judged objectively rather than by unusually timid subjective fears."
    source_date: "IMG_4053.HEIC · 2026-11-25"
    tags:
      - topic::torts::assault
      - lens::element
      - jurisdiction::canada
      - source::IMG_4053

  - id: assault-imminence-means
    type: qa
    context: "Torts · Assault · Threats"
    front: "In assault, why does a threat made **without actual means** to carry it out fail liability?"
    back: "It fails **imminence**—a threat without actual means does not establish imminent physical contact."
    why_extra: "Per these notes, threat without actual means ≠ imminence; words or gestures signaling future or impossible violence cannot support assault."
    source_date: "IMG_4053.HEIC · 2026-11-25"
    tags:
      - topic::torts::assault
      - lens::boundary
      - jurisdiction::canada
      - source::IMG_4053

  - id: app-assault-feinted-punch
    type: qa
    context: "Torts · Assault · Application"
    front: "D swings a fist right at P's face and stops an inch short purely to scare P—why does this still satisfy assault's **intent** element?"
    back: "Assault requires only intent to put P in **fear or expectation** of battery, not intent to actually commit the battery."
    why_extra: "Unlike a threat made without actual means (which fails imminence), a close-range feinted punch carries immediate physical ability to strike."
    source_date: "IMG_4053.HEIC · 2026-11-25"
    tags:
      - topic::torts::assault
      - lens::application
      - jurisdiction::canada
      - source::IMG_4053

  - id: contrast-assault-vs-iims-cumulative
    type: qa
    context: "Torts · Assault vs. IIMS"
    front: "How does **assault** differ from **IIMS** in treating cumulative conduct over time?"
    back: "Assault covers only **discrete** imminent instances, whereas IIMS can be established by either a single act or **cumulative** conduct."
    why_extra: "Long-running patterns of emotional abuse that lack discrete threats of immediate physical contact fit IIMS or harassment rather than assault."
    source_date: "IMG_4053.HEIC & IMG_4055.HEIC · 2026-11-25"
    tags:
      - topic::torts::assault
      - topic::torts::iims
      - lens::contrast
      - jurisdiction::canada
      - source::IMG_4053
      - source::IMG_4055

  # =========================================================================
  # 3. FALSE IMPRISONMENT (IMG_4052.HEIC)
  # =========================================================================
  - id: false-imprisonment-definition
    type: qa
    context: "Torts · Intentional Torts (Person)"
    front: "What is the legal definition of **false imprisonment**?"
    back: "A wrongful **total restraint** on the plaintiff's liberty directly brought about by the defendant."
    why_extra: "Partial obstruction (blocking one path when another safe exit exists) is not total restraint and does not constitute false imprisonment."
    source_date: "IMG_4052.HEIC · 2026-11-25"
    add_reverse: true
    tags:
      - topic::torts::false_imprisonment
      - lens::definition
      - jurisdiction::canada
      - source::IMG_4052

  - id: false-imprisonment-escape-boundary
    type: qa
    context: "Torts · False Imprisonment · Total Restraint"
    front: "Under false imprisonment, when does an **available exit** still fail to defeat 'total restraint'?"
    back: "When it is not a **reasonable means of escape**."
    why_extra: "Element 1 requires P to be totally restrained—forcing P to jump from a high window or risk serious injury is not a reasonable means of escape."
    source_date: "IMG_4052.HEIC · 2026-11-25"
    tags:
      - topic::torts::false_imprisonment
      - lens::boundary
      - jurisdiction::canada
      - source::IMG_4052

  - id: false-imprisonment-deprivation-standard
    type: qa
    context: "Torts · False Imprisonment · Deprivation"
    front: "What legal test defines **'deprived of liberty'** under element 2 of false imprisonment?"
    back: "Whether a **reasonable person in P's position** would feel they have **no choice** (whether physical or psychological)."
    why_extra: "The restraint must also be against P's will—voluntary submission is not deprivation."
    source_date: "IMG_4052.HEIC · 2026-11-25"
    tags:
      - topic::torts::false_imprisonment
      - lens::element
      - jurisdiction::canada
      - source::IMG_4052

  - id: false-imprisonment-causation
    type: qa
    context: "Torts · False Imprisonment · Element 3"
    front: "What must P prove for element 3 of false imprisonment (**deprivation caused directly by D**)?"
    back: "Deprivation **against P's will** meeting **but-for** causation—P would not have yielded without D's act (contribution/influence is insufficient)."
    why_extra: "Merely contributing to or influencing a third party's restraint fails Element 3 unless D's action was the direct but-for cause."
    source_date: "IMG_4052.HEIC · 2026-11-25"
    tags:
      - topic::torts::false_imprisonment
      - lens::mechanism
      - jurisdiction::canada
      - source::IMG_4052

  - id: app-false-imprisonment-security-guard
    type: qa
    context: "Torts · False Imprisonment · Application"
    front: "Store security falsely orders P into an **unlocked** room, and P stays out of perceived legal obligation—why is this still false imprisonment?"
    back: "Deprivation can be **psychological** when a reasonable person in P's position feels they have **no choice** against their will."
    why_extra: "Physical locks or contact are unnecessary once unlawful authority coerces P's submission."
    source_date: "IMG_4052.HEIC · 2026-11-25"
    tags:
      - topic::torts::false_imprisonment
      - lens::application
      - jurisdiction::canada
      - source::IMG_4052

  - id: contrast-false-imprisonment-vs-battery-assault
    type: qa
    context: "Torts · False Imprisonment vs. Battery & Assault"
    front: "What protected interest lets **false imprisonment** succeed when D neither touches P (battery) nor threatens imminent force (assault)?"
    back: "It protects **freedom of movement** against total restraint (physical or psychological), without requiring contact or imminent violence."
    why_extra: "Always spot all three person-torts separately on exams: contact = battery, imminent apprehension = assault, total restraint = false imprisonment."
    source_date: "IMG_4051.HEIC, IMG_4052.HEIC & IMG_4053.HEIC · 2026-11-25"
    tags:
      - topic::torts::false_imprisonment
      - topic::torts::battery
      - topic::torts::assault
      - lens::contrast
      - jurisdiction::canada
      - source::IMG_4051
      - source::IMG_4052
      - source::IMG_4053

  # =========================================================================
  # 4. IIMS — INTENTIONAL INFLICTION OF MENTAL SUFFERING (IMG_4055.HEIC)
  # =========================================================================
  - id: iims-elements-cloze
    type: cloze
    context: "Torts · IIMS"
    text: "IIMS requires (1) {{c1::flagrant and outrageous}} conduct (objectively), (2) {{c2::calculated}} to cause harm (subjectively—from D's perspective), resulting in (3) {{c3::visible and provable}} injury (objectively)."
    why_extra: "Notice the alternating perspectives: Element 1 is objective, Element 2 is subjective (from D's perspective), and Element 3 is objective."
    source_date: "IMG_4055.HEIC · 2026-11-25"
    tags:
      - topic::torts::iims
      - lens::element
      - jurisdiction::canada
      - source::IMG_4055

  - id: iims-element1-malice
    type: qa
    context: "Torts · IIMS · Element 1 (Conduct)"
    front: "Under IIMS element 1 (**flagrant and outrageous conduct**), what role does malicious intent play?"
    back: "Malicious intent is **not required**—the conduct is assessed objectively."
    why_extra: "Even without malice, objectively outrageous conduct (whether one act or cumulative) can satisfy Element 1."
    source_date: "IMG_4055.HEIC · 2026-11-25"
    tags:
      - topic::torts::iims
      - lens::boundary
      - jurisdiction::canada
      - source::IMG_4055

  - id: iims-element1-factors
    type: qa
    context: "Torts · IIMS · Element 1 (Conduct)"
    front: "What objective considerations help courts find conduct **flagrant and outrageous** under IIMS element 1?"
    back: "Whether harm was **foreseeable** or D's conduct was **reckless**, across a single act or cumulative conduct."
    why_extra: "Do not confuse Element 1 with Element 2: foreseeability/recklessness can inform Element 1, yet fail Element 2."
    source_date: "IMG_4055.HEIC · 2026-11-25"
    tags:
      - topic::torts::iims
      - lens::element
      - jurisdiction::canada
      - source::IMG_4055

  - id: iims-element2-threshold
    type: qa
    context: "Torts · IIMS · Element 2 (Mental State)"
    front: "What subjective mental state satisfies IIMS element 2 (**calculated to cause harm**)?"
    back: "D intended to produce such harm, or knew harm was **substantially certain** to follow (intent is **imputed**)."
    why_extra: "Assessed subjectively from D's perspective—not merely what a reasonable person would have foreseen."
    source_date: "IMG_4055.HEIC · 2026-11-25"
    tags:
      - topic::torts::iims
      - lens::mechanism
      - jurisdiction::canada
      - source::IMG_4055

  - id: iims-element2-exclusions
    type: qa
    context: "Torts · IIMS · Element 2 (Mental State)"
    front: "Why do **mere foreseeability** and **reckless disregard** fail IIMS element 2 ('calculated to cause harm')?"
    back: "Element 2 demands subjective intent or **substantial certainty**—lower fault levels do not satisfy it."
    why_extra: "When a fact pattern shows reckless emotional harm rather than substantial certainty, pivot to Internet Harassment or Common-Law Harassment."
    source_date: "IMG_4055.HEIC · 2026-11-25"
    tags:
      - topic::torts::iims
      - lens::boundary
      - jurisdiction::canada
      - source::IMG_4055

  - id: iims-visible-provable-injury
    type: qa
    context: "Torts · IIMS · Element 3 (Injury)"
    front: "Why does the absence of **medical evidence** not necessarily defeat IIMS element 3 ('visible and provable injury')?"
    back: "Courts assess injury objectively by focusing on **symptoms** rather than specific medical diagnoses."
    why_extra: "While medical documentation helps prove the claim, courts examine concrete, observable symptoms rather than requiring a named psychiatric label."
    source_date: "IMG_4055.HEIC · 2026-11-25"
    tags:
      - topic::torts::iims
      - lens::boundary
      - jurisdiction::canada
      - source::IMG_4055

  - id: app-iims-reckless-boss
    type: qa
    context: "Torts · IIMS · Application"
    front: "D publicly berates P with **reckless disregard** for P's mental health, causing diagnosed depression—why does IIMS still fail?"
    back: "Element 2 (**calculated to cause harm**) requires subjective intent or **substantial certainty**; reckless disregard alone fails."
    why_extra: "Recklessness may support Element 1 (flagrant/outrageous), but fails Element 2—check Common-Law Harassment or Internet Harassment instead."
    source_date: "IMG_4055.HEIC · 2026-11-25"
    tags:
      - topic::torts::iims
      - lens::application
      - jurisdiction::canada
      - source::IMG_4055

  - id: contrast-iims-vs-internet-harassment-intent
    type: qa
    context: "Torts · IIMS vs. Internet Harassment · Fault"
    front: "How does the required **mental state** in internet harassment differ from IIMS?"
    back: "Internet harassment captures **recklessness**, whereas IIMS requires subjective **intent or substantial certainty**."
    why_extra: "Internet harassment sets a lower standard of conduct/fault than IIMS while being more elaborate in describing outrageous degree."
    source_date: "IMG_4050.HEIC & IMG_4055.HEIC · 2026-11-25"
    tags:
      - topic::torts::iims
      - topic::torts::internet_harassment
      - lens::contrast
      - jurisdiction::canada
      - source::IMG_4050
      - source::IMG_4055

  - id: contrast-iims-vs-internet-harassment-harm
    type: qa
    context: "Torts · IIMS vs. Internet Harassment · Harm"
    front: "How does the required **harm threshold** in internet harassment differ from IIMS?"
    back: "Internet harassment requires ***Mustapha*-level** harm, which is lower than IIMS's **visible and provable injury**."
    why_extra: "Mustapha-level harm is still more than mere upset, yet stops short of IIMS's visible/provable injury bar."
    source_date: "IMG_4050.HEIC & IMG_4055.HEIC · 2026-11-25"
    tags:
      - topic::torts::iims
      - topic::torts::internet_harassment
      - lens::contrast
      - jurisdiction::canada
      - source::IMG_4050
      - source::IMG_4055

  # =========================================================================
  # 5. INTERNET HARASSMENT (IMG_4050.HEIC)
  # =========================================================================
  - id: internet-harassment-conduct-cloze
    type: cloze
    context: "Torts · Internet Harassment"
    text: "Internet harassment requires D to engage {{c1::maliciously or recklessly}} in outrageous communication conduct beyond all possible bounds of {{c2::decency and tolerance}}."
    why_extra: "Lower conduct/fault threshold than IIMS (accepts recklessness), though more elaborate in describing outrageous degree."
    source_date: "IMG_4050.HEIC · 2026-11-25"
    tags:
      - topic::torts::internet_harassment
      - lens::element
      - jurisdiction::canada
      - source::IMG_4050

  - id: internet-harassment-outrageous-dimensions
    type: qa
    context: "Torts · Internet Harassment · Element 1"
    front: "Across what three dimensions is communication conduct judged **outrageous** in internet harassment?"
    back: "Its **character**, **duration**, and extreme degree."
    why_extra: "This phrasing makes internet harassment 'more elaborate in degree' than IIMS's general 'flagrant and outrageous' label."
    source_date: "IMG_4050.HEIC · 2026-11-25"
    tags:
      - topic::torts::internet_harassment
      - lens::element
      - jurisdiction::canada
      - source::IMG_4050

  - id: internet-harassment-intent
    type: qa
    context: "Torts · Internet Harassment · Element 2 (Targets)"
    front: "What two alternative **intended or reckless effects** satisfy element 2 of internet harassment?"
    back: "Causing **fear, anxiety, or emotional upset**, or **impugning P's dignity**."
    why_extra: "Element 2 is disjunctive—either emotional-upset effects or impugning P's dignity satisfies the target prong."
    source_date: "IMG_4050.HEIC · 2026-11-25"
    tags:
      - topic::torts::internet_harassment
      - lens::element
      - jurisdiction::canada
      - source::IMG_4050

  - id: internet-harassment-element2-fault
    type: qa
    context: "Torts · Internet Harassment · Element 2 (Fault)"
    front: "What two **fault states** are captured under element 2 of internet harassment?"
    back: "Both **intentional** and **reckless** acts."
    why_extra: "The handwritten note explicitly emphasizes '(capture reckless AND intentional act)' under Element 2, setting a lower fault bar than IIMS."
    source_date: "IMG_4050.HEIC · 2026-11-25"
    tags:
      - topic::torts::internet_harassment
      - lens::element
      - jurisdiction::canada
      - source::IMG_4050

  - id: internet-harassment-harm
    type: qa
    context: "Torts · Internet Harassment · Harm"
    front: "What threshold of **harm** must P suffer in internet harassment?"
    back: "***Mustapha*-level** harm—more than mere upset, yet below IIMS's visible and provable injury."
    why_extra: "Element 3 requires P to actually suffer such harm (not actionable per se)."
    source_date: "IMG_4050.HEIC · 2026-11-25"
    tags:
      - topic::torts::internet_harassment
      - lens::boundary
      - jurisdiction::canada
      - source::IMG_4050

  # =========================================================================
  # 6. COMMON-LAW HARASSMENT (IMG_4054.HEIC)
  # =========================================================================
  - id: harassment-conduct-frequency
    type: qa
    context: "Torts · Common-Law Harassment · Element 1"
    front: "What pattern and scope of conduct satisfy element 1 of **common-law harassment**?"
    back: "**Repeated** communications, threats, insults, stalking, or other harassing behaviour (or through other means)."
    why_extra: "Because Element 1 includes 'other harassing behaviour' and 'through other means', it is not limited to four rigid categories—but repetition is required."
    source_date: "IMG_4054.HEIC · 2026-11-25"
    tags:
      - topic::torts::harassment
      - lens::element
      - jurisdiction::canada
      - source::IMG_4054

  - id: harassment-knowledge-standard
    type: qa
    context: "Torts · Common-Law Harassment · Element 2"
    front: "What **knowledge standard** governs whether D's conduct was unwelcome in common-law harassment?"
    back: "D **knew** (subjective) or **ought to have known** (objective) the conduct was unwelcome."
    why_extra: "Both subjective and objective tests can apply—D cannot escape liability by claiming ignorance when a reasonable person would know the acts were unwelcome."
    source_date: "IMG_4054.HEIC · 2026-11-25"
    tags:
      - topic::torts::harassment
      - lens::element
      - jurisdiction::canada
      - source::IMG_4054

  - id: harassment-impact-cloze
    type: cloze
    context: "Torts · Common-Law Harassment · Element 3"
    text: "Element 3 of harassment is met if conduct impugns P's {{c1::dignity}}, would cause a reasonable person to {{c2::fear for safety}} (or loved ones'), or could foreseeably cause {{c3::emotional distress}}."
    why_extra: "Notice the objective tendency/foreseeability wording ('would cause' / 'could foreseeably cause')—distinct from Element 4, which requires actual caused harm."
    source_date: "IMG_4054.HEIC · 2026-11-25"
    tags:
      - topic::torts::harassment
      - lens::element
      - jurisdiction::canada
      - source::IMG_4054

  - id: harassment-harm-threshold
    type: qa
    context: "Torts · Common-Law Harassment · Harm"
    front: "What minimum **harm** must D's conduct cause to satisfy element 4 of common-law harassment?"
    back: "D's conduct must cause at least ***Mustapha*-level** harm."
    why_extra: "Like internet harassment, common-law harassment is not actionable per se—P must prove caused harm rising to at least the Mustapha threshold."
    source_date: "IMG_4054.HEIC · 2026-11-25"
    tags:
      - topic::torts::harassment
      - lens::boundary
      - jurisdiction::canada
      - source::IMG_4054

  - id: torts-harm-severity-ladder
    type: qa
    context: "Torts · Common-Law Harassment · Harm Ladder"
    front: "Rank these three tort **harm tiers** from highest to lowest: *psychological injury*, *severe/extreme*, *visible/provable harm*."
    back: "**Visible/provable harm** > severe/extreme > psychological injury."
    why_extra: "This ladder from IMG_4054 anchors the relative thresholds across mental-distress torts: IIMS sits at the top (visible/provable), while harassment requires at least Mustapha-level psychological injury."
    source_date: "IMG_4054.HEIC · 2026-11-25"
    tags:
      - topic::torts::harassment
      - topic::torts::iims
      - lens::contrast
      - jurisdiction::canada
      - source::IMG_4054

  - id: contrast-harassment-vs-internet-conduct
    type: qa
    context: "Torts · Harassment vs. Internet Harassment · Conduct"
    front: "How does the required **conduct** in common-law harassment differ from internet harassment?"
    back: "Common-law harassment requires **repeated** unwelcome acts; internet harassment targets **outrageous** communication conduct (character, duration, extreme degree)."
    why_extra: "Common-law harassment spans offline or online repeated stalking/threats/insults; internet harassment focuses on extreme communication conduct."
    source_date: "IMG_4050.HEIC & IMG_4054.HEIC · 2026-11-25"
    tags:
      - topic::torts::harassment
      - topic::torts::internet_harassment
      - lens::contrast
      - jurisdiction::canada
      - source::IMG_4050
      - source::IMG_4054

  - id: contrast-harassment-vs-internet-fault
    type: qa
    context: "Torts · Harassment vs. Internet Harassment · Fault"
    front: "How does D's required **knowledge or fault** in common-law harassment differ from internet harassment?"
    back: "Common-law harassment asks if D **knew or ought to have known** acts were unwelcome; internet harassment requires acting **maliciously or recklessly**."
    why_extra: "Common-law harassment's 'ought to have known' prong brings in an objective knowledge standard."
    source_date: "IMG_4050.HEIC & IMG_4054.HEIC · 2026-11-25"
    tags:
      - topic::torts::harassment
      - topic::torts::internet_harassment
      - lens::contrast
      - jurisdiction::canada
      - source::IMG_4050
      - source::IMG_4054

  - id: contrast-harassment-vs-iims-conduct
    type: qa
    context: "Torts · Common-Law Harassment vs. IIMS · Conduct"
    front: "How do **common-law harassment** and **IIMS** differ on whether a single act suffices?"
    back: "Harassment requires **repeated** acts, whereas IIMS can be established by a **single act** or cumulative conduct."
    why_extra: "A single extreme incident cannot support common-law harassment (which requires repetition), so analyze IIMS instead."
    source_date: "IMG_4054.HEIC & IMG_4055.HEIC · 2026-11-25"
    tags:
      - topic::torts::harassment
