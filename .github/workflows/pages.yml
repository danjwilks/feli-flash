name: Deploy Anki Deck Preview to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -v

      - name: Build & verify both Anki decks + previews
        run: |
          # Deck 1 (Start Here): Bare-minimum Core Elements & Legal Tests (17 cards)
          uv run feli-flash build decks/tort-law-elements.yaml \
            -o dist/canadian-tort-law-elements.apkg \
            --preview dist/index.html \
            --no-audit \
            --alt-link-label "Full Deep Dive (125 cards)" \
            --alt-link-href "deep-dive.html"

          # Deck 2 (Preserved Full Version): Atomic Nuances, Contrasts & Applications (103 notes / 125 cards)
          uv run feli-flash build decks/tort-law.yaml \
            -o dist/canadian-tort-law.apkg \
            --preview dist/deep-dive.html \
            --strict \
            --alt-link-label "← Core Elements (17 cards)" \
            --alt-link-href "index.html"

          cp dist/index.html dist/elements.html
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
